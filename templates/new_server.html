{% extends 'layout.html'%}

{% block body %}
<main class="main-content">
    <div class="card new-server-card">
        <div class="content-header">
            <h1 data-i18n="new_server.create_new_server">{{ t('new_server.create_new_server') }}</h1>
            <p data-i18n="new_server.new_server_description">{{ t('new_server.new_server_description') }}</p>
        </div>

        <form id="create-server-form" class="new-server-form">
            <div class="form-grid">
                <label class="form-field">
                    <span data-i18n="new_server.server_name">{{ t('new_server.server_name') }}</span>
                    <input name="name" type="text" required minlength="3" maxlength="20" pattern="^[A-Za-z0-9_\-]{3,20}$" placeholder="mi-servidor" title="Usa 3 a 20 caracteres: letras, números, _ o -">
                </label>

                <label class="form-field">
                    <span data-i18n="new_server.minecraft_version">{{ t('new_server.minecraft_version') }}</span>
                    <input name="version" type="text" required placeholder="1.20.4" pattern="^(1|26)\.\d+(\.\d+)?$">
                </label>

                <label class="form-field form-field-wide select-field" for="software-trigger">
                    <span id="software-label" data-i18n="new_server.server_software">{{ t('new_server.server_software') }}</span>
                    <div class="custom-select" data-custom-select>
                        <button
                            id="software-trigger"
                            class="custom-select-trigger"
                            type="button"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                            aria-controls="software-listbox"
                            aria-labelledby="software-label software-value"
                        >
                            <span id="software-value" class="custom-select-value is-placeholder" data-i18n="new_server.select_one">{{ t('new_server.select_one') }}</span>
                        </button>

                        <ul id="software-listbox" class="custom-select-list" role="listbox" tabindex="-1" hidden>
                            <li id="software-option-vanilla" class="custom-select-option" role="option" data-value="vanilla">Vanilla</li>
                            <li id="software-option-paper" class="custom-select-option" role="option" data-value="paper">Paper</li>
                            <li id="software-option-spigot" class="custom-select-option" role="option" data-value="spigot">Spigot</li>
                            <li id="software-option-fabric" class="custom-select-option is-disabled" role="option" data-value="fabric" aria-disabled="true">Fabric</li>
                        </ul>
                    </div>
                    <input type="hidden" name="software" id="software" value="">
                </label>
            </div>

            <div class="form-actions">
                <a class="btn btn-secondary" href="{{ url_for('pages.index') }}" data-i18n="new_server.cancel">{{ t('new_server.cancel') }}</a>
                <button class="btn btn-primary" type="submit" data-i18n="new_server.create_server">{{ t('new_server.create_server') }}</button>
            </div>
        </form>
    </div>
</main>

<script src="{{ url_for('static', filename='js/new_server.js') }}"></script>
{% endblock %}
