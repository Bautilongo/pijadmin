{% extends "layout.html" %}

{% block body %}
<div class="main-content">
    <div class="content-header">
        <h1 data-i18n="index.servers">{{ t('index.servers') }}</h1>
    </div>

    {% if servers %}
    <div class="servers-grid">
        {% for server in servers %}
        <div class="server-card" id="server-{{server.suffix.lstrip('.')}}">
            <div class="server-badge">
                <h3>{{server.suffix.lstrip('.')}}</h3>
            </div>
            <div class="server-actions">
                <button class="btn btn-sm btn-secondary" id="configure-button" data-server="{{server.suffix.lstrip('.')}}" data-i18n="index.configure" onclick="configure(this)">{{ t('index.configure') }}</button>
                <button class="btn btn-sm btn-danger" id="delete-button" data-server="{{server.suffix.lstrip('.')}}" data-i18n="index.delete" onclick="confirmDel(this)">{{ t('index.delete') }}</button>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="action-bar">
        <button class="btn btn-primary" data-i18n="index.new_server" onclick="serverCreate()">{{ t('index.new_server') }}</button>
    </div>
    {% else %}
    <div class="empty-state">
        <h2 data-i18n="index.start_new_server">{{ t('index.start_new_server') }}</h2>
        <p data-i18n="index.no_server_yet">{{ t('index.no_server_yet') }}</p>
        <a class="btn btn-primary btn-lg" data-i18n="index.create_server" href="{{ url_for('pages.new_server') }}">{{ t('index.create_server') }}</a>
    </div>
    {% endif %}
</div>

<script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
