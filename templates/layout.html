<!DOCTYPE html>
<html>
<head>
    <title>PIJadmin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
    <script src="{{ url_for('static', filename='js/i18n.js') }}" defer></script>
    <script src="/static/js/modal.js" defer></script>
    {% block head %}
    {% endblock %}
</head>
<body>
    <a class="project-identity" href="/index" aria-label="Ir al inicio de PIJadmin">
        {% if not sfw_mode %}
        <img class="project-identity-logo" src="{{ url_for('static', filename='icons/logo.svg') }}" alt="PIJadmin">
        {% else %}
        <img class="project-identity-logo" src="{{ url_for('static', filename='icons/logo_sfw.svg') }}" alt="PIJadmin">
        {% endif %}
        <span class="project-identity-text">PIJadmin</span>
    </a>
    {% block nav %}
    {% endblock %}
    {% block body %}
    {% endblock %}
</body>
</html>
