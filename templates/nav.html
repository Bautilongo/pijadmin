{% extends "layout.html" %}

{% block nav %}
    <header class="nav-wrapper">
        <div class="nav-inner">
            <button class="nav-menu-btn" id="nav-menu-btn" aria-label="Menú" aria-expanded="false" aria-controls="nav-dropdown">
                <img src="{{ url_for('static', filename='icons/menu.svg') }}" alt="Menu">
            </button>
            <div class="nav-dropdown" id="nav-dropdown" hidden>
                <div class="nav-dropdown-section">
                    <span class="nav-dropdown-label" data-i18n="nav.language">Idioma</span>
                    <div class="nav-dropdown-options" id="nav-lang-options">
                        <button class="nav-dropdown-option" data-lang="es" onclick="setLanguage('es')">
                            <img src="{{ url_for('static', filename='icons/check.svg') }}" alt="check">
                            Español
                        </button>
                        <button class="nav-dropdown-option" data-lang="en" onclick="setLanguage('en')">
                            <img src="{{ url_for('static', filename='icons/check.svg') }}" alt="check">
                            English
                        </button>
                    </div>
                </div>
                <div class="nav-dropdown-divider"></div>
                <div class="nav-dropdown-section">
                    <div class="nav-settings-menu">
                        <button class="nav-dropdown-option" id="nav-settings-btn" type="button" aria-expanded="false" aria-controls="nav-settings-dropdown">
                            <img src="{{ url_for('static', filename='icons/settings.svg') }}" alt="Settings">
                            <span data-i18n="nav.settings">Ajustes</span>
                        </button>
                        <div class="nav-dropdown nav-settings-dropdown" id="nav-settings-dropdown" hidden>
                            <div class="nav-dropdown-section">
                                <button class="nav-dropdown-option" type="button" {% if not sfw_mode %} onclick="enable_sfw_mode(this)" {% else %} onclick="disable_sfw_mode(this)" {% endif %}>
                                    <img src="{% if not sfw_mode %}{{ url_for('static', filename='icons/shield_with_heart.svg') }}{% else %}{{ url_for('static', filename='icons/shield_off.svg') }}{% endif %}" alt="SFW Mode">
                                    <span>{% if not sfw_mode %} Activar modo SFW {% else %} Desactivar modo SFW {% endif %}</span>
                                </button>
                                <button class="nav-dropdown-option" type="button">
                                    <svg class="nav-placeholder-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
                                    <span>Placeholder 2</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <a class="nav-dropdown-option" href="https://pijadmin.xenomorphyk.one">
                        <img src="{{ url_for('static', filename='icons/about.svg') }}" alt="About">
                        <span data-i18n="nav.about">Acerca de</span>
                    </a>
                </div>
            </div>
            <nav class="navbar-pill">
            <div class="nav-brand">
                <span class="brand-dot" id="connection-dot" aria-hidden="true"></span>
                <span><span data-i18n="nav.server_dashboard">Dashboard del servidor </span><span>{{server_name}}</span>
            </div>
            <div class="nav-links">
                <a class="nav-link" href="#panel-main" data-i18n="nav.server">Servidor</a>
                <a class="nav-link" href="#panel-options" data-i18n="nav.options">Opciones</a>
                <a class="nav-link" href="#panel-console" data-i18n="nav.console">Consola</a>
            </div>
            </nav>
        </div>
    </header>
<script src="{{ url_for('static', filename='js/nav.js') }}"></script>
{% endblock %}
